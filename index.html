    <meta name="theme-color" content="#5A1D29" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Primary meta tags -->
    <title>ClothifyHer — Kurtas, Dresses &amp; Co-ord Sets for Women</title>
    <meta
      name="description"
      content="Shop women's kurtas, dresses, co-ord sets, tops and bottom wear at ClothifyHer. Style, comfort and confidence — delivered across India."

    <meta
      name="keywords"
      content="women clothing, kurtas, dresses, co-ord sets, tops, bottom wear, ethnic wear, online fashion, clothifyher"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClothifyHer" />
    <meta property="og:url" content="https://clothifyher.in/" />
    <meta
      property="og:title"
      content="ClothifyHer — Kurtas, Dresses &amp; Co-ord Sets for Women"
    />
    <meta
      property="og:description"
      content="Style · Comfort · Confidence. Kurtas, dresses, co-ord sets, tops and bottom wear delivered across India."
    />
    <meta property="og:image" content="https://clothifyher.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ClothifyHer — Women's Fashion Online"
    />
    <meta
      name="twitter:description"
      content="Style · Comfort · Confidence. Kurtas, dresses, co-ord sets and more."
    />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ClothifyHer",
        "url": "https://clothifyher.in",
        "logo": "https://clothifyher.in/icon-512.png",
        "slogan": "Style · Comfort · Confidence",
        "description": "Women's kurtas, dresses, co-ord sets, tops and bottom wear delivered across India.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        }
      }
    </script>

    <!-- Structured data: WebSite + SearchAction (enables sitelinks search box) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ClothifyHer",
        "url": "https://clothifyher.in",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://clothifyher.in/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Structured data: site navigation (hint for sitelinks) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "itemListElement": [
          {
            "@type": "SiteNavigationElement",

            "name": "New Arrivals",
            "url": "https://clothifyher.in/categories/new-arrivals"
          },
          {
            "@type": "SiteNavigationElement",

            "name": "Sarees",
            "url": "https://clothifyher.in/categories/sarees"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 5,
            "name": "Bottoms",

          }
        ]
      }
    </script>
