<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e11d74" />

    <!-- Primary meta tags -->
    <title>ClothifyHer - Shop Women's Fashion &amp; Ethnic Wear Online</title>
    <meta
      name="description"
      content="Shop the latest women's fashion at ClothifyHer. Kurtis, sarees, dresses, tops and ethnic wear with fast delivery across India."
    />
    <meta
      name="keywords"
      content="women clothing, kurti, saree, ethnic wear, dresses, tops, online fashion, clothifyher"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://clothifyher.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClothifyHer" />
    <meta property="og:url" content="https://clothifyher.com/" />
    <meta
      property="og:title"
      content="ClothifyHer - Shop Women's Fashion &amp; Ethnic Wear Online"
    />
    <meta
      property="og:description"
      content="Kurtis, sarees, dresses and more — delivered to your doorstep."
    />
    <meta property="og:image" content="https://clothifyher.com/og-image.jpg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClothifyHer - Women's Fashion Online" />
    <meta
      name="twitter:description"
      content="Kurtis, sarees, dresses and more — delivered fast."
    />
    <meta name="twitter:image" content="https://clothifyher.com/og-image.jpg" />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ClothifyHer",
        "url": "https://clothifyher.com",
        "logo": "https://clothifyher.com/logo.png",
        "description": "Women's fashion and ethnic wear delivered across India.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        }
      }
    </script>

    <!-- Structured data: WebSite + SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ClothifyHer",
        "url": "https://clothifyher.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://clothifyher.com/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
